<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BEF264"/>
      <stop offset="100%" stop-color="#84CC16"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect width="48" height="48" rx="14" fill="#101722" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <!-- Map Pin + Camera Lens Hybrid -->
  <path d="M24 8C16.82 8 11 13.82 11 21C11 29.5 24 40 24 40C24 40 37 29.5 37 21C37 13.82 31.18 8 24 8Z" fill="url(#limeGrad)" fill-opacity="0.16" stroke="url(#limeGrad)" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Center Video Aperture / Radar Node -->
  <circle cx="24" cy="20" r="5.5" fill="#A3E635" filter="url(#glow)"/>
  <circle cx="24" cy="20" r="2.5" fill="#080B12"/>
  <!-- Radar Wave arcs -->
  <circle cx="24" cy="20" r="9" stroke="#A3E635" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="2 3"/>
</svg>

